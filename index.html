<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#07070a" />

    <!--app-head-->
    <meta name="author" content="Boomline" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Boomline" />
    <meta property="og:image" content="https://boomline.co/boomline-logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://boomline.co/boomline-logo.png" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Boomline",
      "url": "https://boomline.co",
      "logo": "https://boomline.co/boomline-logo.png",
      "description": "Boomline is purpose-built crane rental software for dispatch, fleet management, inspections, certifications, and field operations.",
      "sameAs": [
        "https://apps.apple.com/us/app/boomline/id6764630978"
      ]
    }
    </script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Boomline",
      "operatingSystem": "iOS, Web",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Crane Rental Management",
      "description": "The operating system for crane rental — dispatch, equipment, inspections, certifications, and field operations. Start small or run the full platform.",
      "url": "https://boomline.co",
      "image": "https://boomline.co/boomline-logo.png",
      "installUrl": "https://apps.apple.com/us/app/boomline/id6764630978",
      "publisher": {
        "@type": "Organization",
        "name": "Boomline",
        "url": "https://boomline.co"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
